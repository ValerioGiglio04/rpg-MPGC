plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'it.unicam.cs.mpgc'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'org.hibernate.orm:hibernate-core:6.6.5.Final'
    implementation 'com.h2database:h2:2.3.232'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg125664.app.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

spotless {
    enforceCheck false
    java {
        target 'src/**/*.java'
        importOrder('java', 'javax', 'jakarta', '', 'it')
        removeUnusedImports()
        prettier(['prettier': '3.4.2', 'prettier-plugin-java': '2.9.6'])
            .configFile('.prettierrc.json')
            .config(['parser': 'java', 'plugins': ['prettier-plugin-java']])
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target 'src/**/*.json', 'src/main/resources/**/*.json'
        gson().indentWithSpaces(2)
    }
}

// Avvia la console H2 web sul browser per ispezionare il database di salvataggio.
//   JDBC URL: jdbc:h2:file:~/.rpg-palestre-creature/save;AUTO_SERVER=TRUE
//   User:     sa
//   Password: (vuota)
tasks.register('h2Console', JavaExec) {
    group = 'application'
    description = 'Apre la console web di H2 sul database embedded'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.h2.tools.Console'
    args = ['-web', '-browser']
}
